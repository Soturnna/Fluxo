# Definição do projeto para o XcodeGen.
# O arquivo .xcodeproj não fica no repositório: ele é gerado a partir daqui
# no Mac do GitHub Actions, a cada compilação.
name: Fluxo
options:
  bundleIdPrefix: com.soturnna
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Fluxo:
    type: application
    platform: iOS
    sources:
      - path: Fluxo
    scheme: {}
    info:
      path: Fluxo/Info.plist
      properties:
        CFBundleDisplayName: Fluxo
        CFBundleDevelopmentRegion: pt-BR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Light
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Texto mostrado pelo iOS na primeira vez que o app pede o Face ID.
        NSFaceIDUsageDescription: O Fluxo usa o Face ID para proteger suas informações financeiras.
        # Segurança de rede: nenhuma exceção ao App Transport Security.
        # Sem NSAppTransportSecurity aqui, o iOS só permite conexões HTTPS.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soturnna.fluxo
        PRODUCT_NAME: Fluxo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
